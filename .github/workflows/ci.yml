# GitHub Actions CI/CD Pipeline for TradingIA
# Runs on: push to main/develop, pull requests

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # Lint and Code Quality
  # ============================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy
      
      - name: Check formatting with Black
        run: black --check --line-length=120 core/ tests/ utils/
        continue-on-error: true
      
      - name: Check import sorting with isort
        run: isort --check-only --profile=black --line-length=120 core/ tests/ utils/
        continue-on-error: true
      
      - name: Lint with flake8
        run: |
          flake8 core/ tests/ utils/ \
            --max-line-length=120 \
            --extend-ignore=E203,E501,W503 \
            --exclude=__pycache__,archive

  # ============================================
  # Unit Tests
  # ============================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-cov pytest-timeout
      
      - name: Create test directories
        run: |
          mkdir -p data/raw data/logs data/cache
      
      - name: Run tests
        run: |
          pytest tests/ \
            -v \
            --timeout=60 \
            --ignore=tests/test_live_integration.py \
            --ignore=tests/test_platform.py \
            -x
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      
      - name: Run core tests with coverage
        run: |
          pytest tests/test_corrupted_data.py tests/test_structure.py \
            --cov=core \
            --cov-report=xml \
            --cov-report=term-missing
        continue-on-error: true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ============================================
  # Security Scan
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install bandit
        run: pip install bandit
      
      - name: Run security scan
        run: |
          bandit -r core/ -x tests/ \
            --skip B101,B311 \
            -f json -o bandit-report.json || true
      
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
        if: always()

  # ============================================
  # Build Docker Image
  # ============================================
  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: trading-ia:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Integration Tests (Manual trigger)
  # ============================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest alpaca-trade-api
      
      - name: Run integration tests
        run: |
          pytest tests/test_live_integration.py -v --timeout=120
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
